name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build TrailerGuard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Dependencies
        run: |
          npm install --force
          npm install --force @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android || true

      - name: Add Permissions to AndroidManifest.xml
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="true" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build & Sign Release AAB for Google Play
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias trailerguard -dname "CN=TrailerGuard DMS, OU=Mobile, O=TrailerGuard, C=US" -storepass trailerguard123 -keypass trailerguard123
          cd android
          ./gradlew bundleRelease --no-daemon
          cd ..
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            echo "Signing $AAB_FILE..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass trailerguard123 -keypass trailerguard123 "$AAB_FILE" trailerguard
            cp "$AAB_FILE" ./TrailerGuard-DMS-release.aab
            cp release.jks ./TrailerGuard-Keystore.jks
            echo "AAB successfully generated and signed."
          fi

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: TrailerGuard-DMS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: TrailerGuard-GooglePlay-AAB
          path: |
            TrailerGuard-DMS-release.aab
            TrailerGuard-Keystore.jks
